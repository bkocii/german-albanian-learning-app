{% extends "base.html" %}

{% block title %}Rivendos fjalëkalimin{% endblock %}

{% block content %}
<section class="card auth-card">
    <h1>Rivendos fjalëkalimin</h1>
    <p>Shkruani emailin dhe do t'ju dërgojmë një lidhje të sigurt.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Dërgo lidhjen</button>
    </form>
</section>
{% endblock %}
