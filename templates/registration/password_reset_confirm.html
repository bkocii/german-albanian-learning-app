{% extends "base.html" %}

{% block title %}Fjalëkalim i ri{% endblock %}

{% block content %}
<section class="card auth-card">
    <h1>Vendosni fjalëkalimin e ri</h1>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button" type="submit">Ruaj fjalëkalimin</button>
        </form>
    {% else %}
        <p>Lidhja nuk vlen më. Kërkoni një lidhje të re.</p>
        <a href="{% url 'accounts:password-reset' %}">Kërko lidhje të re</a>
    {% endif %}
</section>
{% endblock %}
